<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>課後回饋｜飛資得講習站</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/form.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="eyebrow">ONE-MINUTE FEEDBACK</div>
      <h1 id="title">課後回饋</h1>
      <div class="meta" id="meta"></div>
      <div class="chips"><span>約 1 分鐘</span><span>匿名填答</span></div>
    </header>
    <main class="body" id="body" aria-live="polite">
      <div class="fine">載入中…</div>
    </main>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/app.js"></script>
  <script src="../assets/form.js"></script>
  <script>
  (function () {
    'use strict';
    var h = TS.h;
    var setBusy = TS.setBusy;
    var checkMark = TS.checkMark;
    var code = TS.code();
    var body = document.getElementById('body');
    var survey = null;
    var form = null;
    var startedAt = 0;
    var saved = TS.store.get('done:' + code) || null;

    var CONSENT = '我同意提供姓名與 Email，僅用於本次抽獎與得獎聯繫，活動結束後 30 天內刪除。';
    var ERR = {
      NETWORK: '網路好像不太穩，請再按一次。',
      NOT_CONFIGURED: '網站還沒設定完成，請告訴講師。',
      NOT_FOUND: '請確認 QR Code 或網址是否正確。',
      TOO_FAST: '填得有點快，請再確認一下題目後送出。',
      CLOSED: '問卷已經截止了，謝謝你。',
      NOT_OPEN: '問卷還沒開放。',
      FULL: '這堂課的名額已滿，謝謝你。',
      REQUIRED: '還有必填題沒有填。',
      INVALID: '有題目的答案不正確，請重新選一次。',
      TOO_LONG: '文字最多 500 字。',
      BUSY: '現在填答的人很多，請再按一次。',
      DUPLICATE: '這個 Email 已經登記過這堂課的抽獎囉，不用再登記一次。',
      INVALID_EMAIL: 'Email 格式好像不對，請再確認一下。',
      INVALID_NAME: '姓名請填 1～30 個字。',
      CONSENT_REQUIRED: '請先勾選同意，才能登記抽獎。',
      BAD_TOKEN: '抽獎登記失敗，請重新整理後再試一次。',
      TOKEN_EXPIRED: '抽獎登記的時間已經過了。',
      TOKEN_USED: '這份問卷已經登記過抽獎了。',
      NO_RAFFLE: '這堂課的抽獎已經結束。',
      SERVER_ERROR: '系統出了點問題，請稍後再試。'
    };
    function errText(code) { return ERR[code] || ERR.SERVER_ERROR; }

    function setHeader(s) {
      document.getElementById('title').textContent = s.title || '課後回饋';
      document.getElementById('meta').textContent = [TS.formatDate(s.date), s.org_name].filter(Boolean).join('・');
      if (s.title) document.title = s.title + '｜課後回饋';
    }

    function state(title, text, extra) {
      TS.fill(body, h('div', { class: 'state' }, h('h2', { text: title }), text ? h('p', { text: text }) : null), extra || null);
    }

    function footNote() {
      return h('div', { class: 'fine', text: '問卷不蒐集姓名與 Email。送出後可另外登記抽獎，兩者分開保存。請勿填寫病患資料。' });
    }

    // ---------- 載入 ----------

    if (!/^\d{4}-\d{6}$/.test(code)) {
      state('找不到這份問卷', '請確認 QR Code 或網址是否正確。');
      return;
    }
    TS.api('getSurvey', { survey_code: code }).then(function (res) {
      if (!res.ok) {
        state(res.error === 'NOT_FOUND' ? '找不到這份問卷' : '暫時打不開問卷', errText(res.error),
          res.error === 'NETWORK' ? reloadBtn() : null);
        return;
      }
      survey = res;
      setHeader(res);
      if (saved && saved.submitted) return showThanks();
      if (res.status === 'draft') return state('問卷尚未開放', '講師開放後就能填答，請稍後再試一次。', reloadBtn());
      if (res.status === 'closed') return state('問卷已截止', '這堂課的回饋已經結束收件，謝謝你的參與！');
      renderForm();
    });

    function reloadBtn() {
      return h('button', { type: 'button', class: 'ghost', text: '重新整理', onclick: function () { location.reload(); } });
    }

    // ---------- 問卷 ----------

    var progressBar, progressText, submitBtn, errorBox;

    function renderForm() {
      progressBar = h('i');
      progressText = h('span');
      errorBox = h('div', { class: 'error', role: 'alert' });
      submitBtn = h('button', { type: 'submit', class: 'submit', text: '送出回饋 →' });
      var hp = h('input', { type: 'text', name: 'website', tabindex: '-1', autocomplete: 'off', id: 'website' });

      form = TS.questionForm(survey.questions, function () {
        errorBox.textContent = '';
        updateProgress();
      });
      var el = h('form', { novalidate: true, onsubmit: submit },
        h('div', { class: 'progress' }, h('div', { class: 'bar' }, progressBar), progressText),
        form.cards,
        h('div', { class: 'hp', 'aria-hidden': 'true' }, h('label', { for: 'website', text: '請勿填寫' }), hp),
        footNote(),
        errorBox,
        submitBtn);
      el.style.display = 'contents';
      TS.fill(body, el);
      updateProgress();
      startedAt = Date.now();
    }

    function updateProgress() {
      var req = survey.questions.filter(function (q) { return q.required; });
      var done = req.filter(form.filled).length;
      progressBar.style.width = (req.length ? done / req.length * 100 : 100) + '%';
      progressText.textContent = '完成 ' + done + ' / ' + req.length + ' 題必填';
    }

    function submit(e) {
      e.preventDefault();
      var missing = form.missing();
      if (missing.length) {
        missing.forEach(function (q) { document.getElementById('q-' + q.id).classList.add('missing'); });
        errorBox.textContent = '還有 ' + missing.length + ' 題必填沒有填。';
        document.getElementById('q-' + missing[0].id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      var clean = form.clean();
      setBusy(submitBtn, true);
      TS.api('submitResponse', {
        survey_code: code,
        answers: clean,
        elapsed: Math.round((Date.now() - startedAt) / 1000),
        website: document.getElementById('website').value
      }).then(function (res) {
        if (!res.ok) {
          setBusy(submitBtn, false, '送出回饋 →');
          if (res.error === 'CLOSED') return state('問卷已截止', '這堂課的回饋已經結束收件，謝謝你的參與！');
          errorBox.textContent = errText(res.error);
          if (res.field && document.getElementById('q-' + res.field)) {
            document.getElementById('q-' + res.field).classList.add('missing');
          }
          return;
        }
        saved = { submitted: true, token: res.raffle_token || null, registered: false, declined: false };
        TS.store.set('done:' + code, saved);
        showThanks(true);
      });
    }

    // ---------- 完成與抽獎 ----------

    function prizeBox() {
      return h('div', { class: 'prize' }, h('b', { text: '今天的課後小驚喜' }),
        h('ul', null, survey.prizes.map(function (p) { return h('li', { text: p.name + ' × ' + p.qty }); })));
    }

    function canRaffle() {
      return survey && survey.status === 'open' && survey.raffle_open && saved && saved.token && !saved.registered && !saved.declined;
    }

    function showThanks() {
      var head = h('div', { class: 'state' }, checkMark(), h('h2', { text: '謝謝，回饋已收到！' }),
        saved.registered ? h('p', { text: '你已經登記抽獎了，抽獎會在課堂上進行，祝你好運！' }) :
          canRaffle() ? h('p', { text: '完成問卷就可以參加課後抽獎。' }) : h('p', { text: '祝你有美好的一天。' }));
      if (!canRaffle()) return TS.fill(body, head);
      TS.fill(body, head, prizeBox(),
        h('button', { type: 'button', class: 'submit main', text: '我要參加抽獎', onclick: showRaffleForm }),
        h('button', { type: 'button', class: 'ghost', text: '不用了，完成填答', onclick: function () {
          saved.declined = true;
          TS.store.set('done:' + code, saved);
          showThanks();
        } }));
    }

    function showRaffleForm() {
      var name = h('input', { class: 'input', id: 'rName', maxlength: '30', autocomplete: 'name', required: true });
      var email = h('input', { class: 'input', id: 'rEmail', type: 'email', maxlength: '100', autocomplete: 'email', inputmode: 'email', required: true });
      var agree = h('input', { type: 'checkbox', id: 'rAgree' });
      var err = h('div', { class: 'error', role: 'alert' });
      var btn = h('button', { type: 'submit', class: 'submit main', text: '確認登記' });

      var form = h('form', { novalidate: true, onsubmit: function (e) {
        e.preventDefault();
        if (!name.value.trim()) { err.textContent = '請填姓名。'; name.focus(); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) { err.textContent = ERR.INVALID_EMAIL; email.focus(); return; }
        if (!agree.checked) { err.textContent = ERR.CONSENT_REQUIRED; return; }
        err.textContent = '';
        setBusy(btn, true);
        TS.api('registerRaffle', {
          survey_code: code, name: name.value.trim(), email: email.value.trim(), consent: true, raffle_token: saved.token
        }).then(function (res) {
          setBusy(btn, false, '確認登記');
          if (!res.ok) {
            err.textContent = errText(res.error);
            if (['TOKEN_USED', 'TOKEN_EXPIRED', 'NO_RAFFLE', 'CLOSED'].indexOf(res.error) >= 0) {
              saved.declined = true;
              TS.store.set('done:' + code, saved);
            }
            return;
          }
          saved.registered = true;
          TS.store.set('done:' + code, saved);
          TS.fill(body, h('div', { class: 'state' }, checkMark(), h('h2', { text: '登記完成！' }),
            h('p', { text: '抽獎會在課堂上進行，投影畫面只會顯示遮罩後的姓名與 Email。祝你好運！' })));
        });
      } },
        h('div', { class: 'q' },
          h('div', { class: 'q-label', style: 'margin-top:0', text: '登記抽獎' }),
          h('div', { class: 'fine', style: 'margin:-8px 0 14px', text: '姓名與 Email 和剛才的問卷分開保存，講師無法對應是誰填了哪一份。' }),
          h('div', { style: 'display:flex;flex-direction:column;gap:14px' },
            h('label', { class: 'field', for: 'rName' }, '姓名', name),
            h('label', { class: 'field', for: 'rEmail' }, 'Email（得獎聯繫用）', email),
            h('label', { class: 'consent', for: 'rAgree' }, agree, h('span', { text: CONSENT })))),
        err, btn,
        h('button', { type: 'button', class: 'ghost', text: '返回', onclick: showThanks }));
      form.style.display = 'contents';
      TS.fill(body, prizeBox(), form);
      name.focus();
    }
  })();
  </script>
</body>
</html>
